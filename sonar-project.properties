# Proyecto unico de SonarQube para todos los modulos de Skainet FI.
sonar.projectKey=skainet-fi
sonar.projectName=Skainet FI
sonar.sourceEncoding=UTF-8

# Codigo de produccion
sonar.sources=Skainet-API/src,Skainet-Backend/src,Skainet-Frontend/src,Skainet-Mobile/lib,Skainet-Mobile/android/app/src/main/kotlin
sonar.tests=Skainet-API/test,Skainet-Mobile/test

# Cobertura generada por ejecutar_sonarqube.bat
sonar.javascript.lcov.reportPaths=Skainet-API/coverage/lcov.info,Skainet-Backend/coverage/lcov.info
sonar.dart.lcov.reportPaths=Skainet-Mobile/coverage/lcov.info

# Dependencias, artefactos de compilacion y recursos no son codigo a evaluar.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**,**/.gradle/**,**/generated/**,**/*.g.dart,**/test/**,**/android/app/src/main/res/**
sonar.coverage.exclusions=**/test/**,**/*.g.dart,**/main.dart
