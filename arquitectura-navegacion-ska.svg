<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de navegación y permisos</title>
  <desc id="desc">Diagrama de flujo desde inicio de sesión, validación de roles, panel principal y módulos del sistema.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:400 17px Arial,sans-serif;fill:#64748b}.label{font:700 20px Arial,sans-serif;fill:#102a43}.detail{font:400 15px Arial,sans-serif;fill:#52606d}.step{font:700 14px Arial,sans-serif;fill:#fff}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.access{stroke:#2563eb;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="800" y="72" text-anchor="middle" class="title">Arquitectura de navegación del sistema</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle">Acceso controlado por roles y módulos operativos integrados</text>

  <!-- connectors behind cards -->
  <path class="line" d="M325 348 H415"/>
  <path class="line" d="M675 348 H760"/>
  <path class="line" d="M920 348 H1010 V245 H1090"/>
  <path class="line" d="M920 348 H1010 V405 H1090"/>
  <path class="line" d="M920 348 H1010 V565 H1090"/>
  <path class="access" d="M840 445 V700 H1085"/>

  <!-- login -->
  <g filter="url(#shadow)"><rect x="85" y="270" width="240" height="156" rx="18" fill="#fff" stroke="#0ea5a4" stroke-width="3"/></g>
  <circle cx="125" cy="310" r="19" fill="#0ea5a4"/><text x="125" y="315" text-anchor="middle" class="step">1</text>
  <text x="205" y="337" text-anchor="middle" class="label">Inicio de sesión</text>
  <text x="205" y="368" text-anchor="middle" class="detail">Autenticación de usuario</text>

  <!-- authorization -->
  <g filter="url(#shadow)"><rect x="415" y="270" width="260" height="156" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/></g>
  <circle cx="455" cy="310" r="19" fill="#2563eb"/><text x="455" y="315" text-anchor="middle" class="step">2</text>
  <text x="545" y="329" text-anchor="middle" class="label">Validación de rol</text>
  <text x="545" y="360" text-anchor="middle" class="detail">Permisos y nivel de acceso</text>
  <text x="545" y="384" text-anchor="middle" class="detail">Administrador · Operario · Consulta</text>

  <!-- dashboard -->
  <g filter="url(#shadow)"><rect x="760" y="250" width="160" height="196" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/></g>
  <circle cx="800" cy="290" r="19" fill="#2563eb"/><text x="800" y="295" text-anchor="middle" class="step">3</text>
  <text x="840" y="337" text-anchor="middle" class="label">Panel</text>
  <text x="840" y="363" text-anchor="middle" class="label">principal</text>
  <text x="840" y="398" text-anchor="middle" class="detail">Vista según rol</text>

  <!-- modules -->
  <text x="1265" y="160" text-anchor="middle" class="subtitle">Módulos disponibles según permisos</text>
  <g filter="url(#shadow)"><rect x="1090" y="175" width="350" height="140" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/></g>
  <text x="1265" y="235" text-anchor="middle" class="label">Usuarios y roles</text>
  <text x="1265" y="267" text-anchor="middle" class="detail">Gestión de cuentas y permisos</text>

  <g filter="url(#shadow)"><rect x="1090" y="335" width="350" height="140" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/></g>
  <text x="1265" y="395" text-anchor="middle" class="label">Inventario y kardex</text>
  <text x="1265" y="427" text-anchor="middle" class="detail">Entradas, salidas y existencias</text>

  <g filter="url(#shadow)"><rect x="1090" y="495" width="350" height="140" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/></g>
  <text x="1265" y="553" text-anchor="middle" class="label">Producción, tiempos y pesaje</text>
  <text x="1265" y="585" text-anchor="middle" class="detail">Registro y seguimiento operativo</text>

  <!-- cross cutting search -->
  <g filter="url(#shadow)"><rect x="1085" y="650" width="360" height="118" rx="18" fill="#fffdf0" stroke="#d97706" stroke-width="3"/></g>
  <text x="1265" y="702" text-anchor="middle" class="label">Búsqueda avanzada</text>
  <text x="1265" y="734" text-anchor="middle" class="detail">Consulta transversal de todos los módulos</text>
  <text x="912" y="684" class="subtitle" fill="#2563eb">Acceso desde el panel</text>

  <rect x="85" y="820" width="22" height="22" rx="5" fill="#0ea5a4"/><text x="120" y="838" class="detail">Flujo de acceso</text>
  <rect x="300" y="820" width="22" height="22" rx="5" fill="#16a34a"/><text x="335" y="838" class="detail">Módulos operativos</text>
  <path d="M540 831 H590" class="access"/><text x="605" y="838" class="detail">Función transversal</text>
</svg>
